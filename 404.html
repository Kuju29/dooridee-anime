<script>
  (function () {
    var main = document.getElementById("main"), tries = 0;
    var base = new URL(document.baseURI).pathname, path = location.pathname;
    path = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, "");
    var showSlug = (path.match(/^anime\/([^/]+)\/?$/) || [])[1];
    function line(w) { return '<div class="sk sk-line" style="width:' + w + '"></div>'; }
    function skel() {
      if (showSlug) return '<div class="show-hero"><div class="show-in"><div class="sk show-cover sk-cover"></div><div class="sk-col">'
        + line("55%") + line("30%") + line("92%") + line("88%") + line("70%") + '</div></div></div><div class="wrap sk-col">'
        + line("35%") + line("100%") + line("100%") + line("100%") + line("100%") + '</div>';
      var cols = 5; try { cols = JSON.parse(localStorage.getItem("aw3:cols")) || 5; } catch (e) {   }
      var cards = ""; for (var i = 0; i < 15; i++) cards += '<div class="pc"><div class="sk pc-img"></div>' + line("85%") + line("55%") + '</div>';
      return '<div class="wrap"><div class="cat-head sk-col">' + line("280px") + '</div><div class="grid" style="--cols:' + cols + '">' + cards + '</div></div>';
    }
    var pre = main.querySelector(".seo");
    if (pre) {
      pre.hidden = true;
      var c = main.querySelector(".crumbs"); if (c) c.hidden = true;
    }
    main.insertAdjacentHTML("afterbegin", '<div class="sk-page" aria-busy="true" aria-label="กำลังโหลด">' + skel() + '</div>');
    if (window.AW_STATIC && showSlug) {
      window.AW_PREFETCH = {};
      window.AW_PREFETCH[decodeURIComponent(showSlug)] = fetch("anime/" + showSlug + "/index.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
      window.AW_PREFETCH[decodeURIComponent(showSlug)].catch(function () {   });
    }
    function start(d) {
      window.ANIME_DATA = d;
      var a = document.createElement("script"); a.src = "assets/app.js?v=227"; document.body.appendChild(a);
    }
    function getJSON(u) {
      return fetch(u, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    }
    function failed() {
      main.innerHTML = !window.AW_STATIC && /^(localhost|127\.)/.test(location.hostname)
        ? '<p class="empty">ติดต่อเซิร์ฟเวอร์ไม่ได้ ดับเบิลคลิก run.bat แล้วรีเฟรชหน้านี้</p>'
        : '<p class="empty">โหลดข้อมูลไม่สำเร็จ กำลังลองใหม่เองทุก 5 วินาที</p>';
      setTimeout(load, 5000);
    }
    function load() {
      var S = window.AW_STATIC, siteUrl = S ? S.site : "api/site", hitsUrl = S ? S.hits : "api/hits";
      var hits = fetch(hitsUrl, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; });
      if (S && S.first && !/^series\//.test(path)) {
        var showP = showSlug ? window.AW_PREFETCH[decodeURIComponent(showSlug)].catch(function () { return null; }) : null;
        Promise.all([getJSON(S.first), showP]).then(function (r) {
          var d = r[0], full = r[1];
          if (full) {
            delete full.url; delete full.licensors; delete full._how_to_read;
            for (var i = 0; i < d.shows.length && String(d.shows[i].id) !== String(full.id); i++) {   }
            d.shows[i] = full;
          }
          getJSON(siteUrl).then(function (all) { window.AW_FULL_DATA = all; if (window.AW_FULL) window.AW_FULL(all); })
            .catch(function () {   });
          hits.then(function (h) { window.ANIME_HITS = h; start(d); });
        }).catch(function () {
          getJSON(siteUrl).then(function (d) { hits.then(function (h) { window.ANIME_HITS = h; start(d); }); }).catch(failed);
        });
        return;
      }
      fetch(siteUrl, { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.building || !d.shows || !d.shows.length) {
          tries++;
          main.innerHTML = '<p class="empty">กำลังดึงข้อมูลจากค่ายต่าง ๆ ครั้งแรก (' + (d.running || "เริ่มต้น") + ') หน้านี้จะแสดงเองเมื่อพร้อม</p>';
          setTimeout(load, 5000);
          return;
        }
        hits.then(function (h) { window.ANIME_HITS = h; start(d); });
      }).catch(failed);
    }
    load();
  })();
</script>
